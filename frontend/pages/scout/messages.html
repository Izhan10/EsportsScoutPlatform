<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Messages · PakEsports Scout PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --obsidian: #070B14;
      --graphite: #0B1020;
      --hyper-purple: #A855F7;
      --toxic-lime: #A3FF12;
      --electric-teal: #06B6D4;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-stroke: rgba(255, 255, 255, 0.08);
      --text: #dfe2f0;
      --text-muted: rgba(255, 255, 255, 0.4);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --sidebar-w: 260px;
      --nav-h: 60px;
      --font-display: 'Sora', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html, body { height: 100%; background: var(--obsidian); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    .top-nav { display: flex; align-items: center; height: var(--nav-h); padding: 0 20px; background: rgba(7, 11, 20, 0.9); backdrop-filter: blur(40px); border-bottom: 1px solid var(--glass-border); flex-shrink: 0; z-index: 100; gap: 0; }
    .top-nav .brand { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--toxic-lime), var(--electric-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; margin-right: 32px; }
    .top-nav .brand small { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.08em; -webkit-text-fill-color: var(--text-muted); color: var(--text-muted); background: none; margin-left: 4px; }
    .top-nav .nav-links { display: flex; align-items: center; gap: 4px; }
    .top-nav .nav-links a { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-radius: 8px; transition: background 0.2s, color 0.2s; white-space: nowrap; }
    .top-nav .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .top-nav .nav-links a.active { color: var(--toxic-lime); background: rgba(163,255,18,0.08); }
    .top-nav .icon-group { display: flex; align-items: center; gap: 6px; margin-left: 16px; }
    .top-nav .icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; }
    .top-nav .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .top-nav .icon-btn .material-symbols-outlined { font-size: 20px; }
    .top-nav .notif-dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--competitive-red, #FF3B81); box-shadow: 0 0 8px rgba(255,59,129,0.6); }
    .top-nav .notif-btn { position: relative; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: rgba(7, 11, 20, 0.95); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 20px 12px 16px; overflow-y: auto; z-index: 50; }
    .sidebar .scout-profile { display: flex; align-items: center; gap: 12px; padding: 0 8px 16px; border-bottom: 1px solid var(--glass-border); margin-bottom: 16px; }
    .sidebar .scout-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--toxic-lime); box-shadow: 0 0 16px rgba(163,255,18,0.25); object-fit: cover; flex-shrink: 0; }
    .sidebar .scout-info h4 { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text); }
    .sidebar .scout-info .badge-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .sidebar .scout-info .badge-row .mode-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 4px; background: rgba(168,85,247,0.15); color: var(--hyper-purple); border: 1px solid rgba(168,85,247,0.25); }
    .sidebar .scout-info .badge-row .level-badge { font-family: var(--font-mono); font-size: 8px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; background: rgba(6,182,212,0.12); color: var(--electric-teal); border: 1px solid rgba(6,182,212,0.2); }
    .sidebar .nav-section { margin-bottom: 20px; }
    .sidebar .nav-section .section-label { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); padding: 0 8px; margin-bottom: 6px; }
    .sidebar .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: background 0.2s, color 0.2s; }
    .sidebar .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .sidebar .nav-item .material-symbols-outlined { font-size: 18px; }
    .sidebar .nav-item.active { background: rgba(163,255,18,0.06); color: var(--toxic-lime); border-left: 2px solid var(--toxic-lime); border-radius: 0 8px 8px 0; margin-left: -2px; padding-left: 12px; }
    .sidebar .spacer { flex: 1; }
    .sidebar .bottom-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: background 0.2s, color 0.2s; }

    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: rgba(7,11,20,0.95); backdrop-filter: blur(40px); border-top: 1px solid var(--glass-border); z-index: 200; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom, 0); }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--text-muted); font-size: 9px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; padding: 4px 0; }
    .bottom-nav a .material-symbols-outlined { font-size: 20px; }
    .bottom-nav a.active { color: var(--toxic-lime); }

    /* ═══════════ MESSAGES LAYOUT ═══════════ */
    .main-area { flex: 1; overflow: hidden; display: flex; padding: 0; }
    .msgs-layout { display: flex; height: 100%; width: 100%; }

    .conv-list { width: 320px; flex-shrink: 0; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; background: rgba(7,11,20,0.5); }
    .conv-list-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--glass-border); }
    .conv-list-header h2 { font-family: var(--font-display); font-size: 18px; font-weight: 800; }
    .conv-list-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .conv-items { flex: 1; overflow-y: auto; padding: 8px; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; transition: background 0.2s; position: relative; }
    .conv-item:hover { background: rgba(255,255,255,0.04); }
    .conv-item.active { background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.25); }
    .conv-item img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .conv-item .conv-info { flex: 1; min-width: 0; }
    .conv-item .conv-info .conv-name { font-family: var(--font-display); font-size: 13px; font-weight: 700; }
    .conv-item .conv-info .conv-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .conv-item .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .conv-item .conv-meta .conv-time { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); white-space: nowrap; }
    .conv-item .conv-meta .unread-badge { width: 18px; height: 18px; border-radius: 50%; background: var(--hyper-purple); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

    .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-panel .chat-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--glass-border); }
    .chat-panel .chat-header img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .chat-panel .chat-header .chat-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
    .chat-panel .chat-header .chat-role { font-size: 11px; color: var(--text-muted); text-transform: capitalize; }
    .chat-panel .chat-header .back-btn { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; margin-right: 4px; }

    .chat-msgs { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; }
    .chat-msgs .empty-state { text-align: center; color: var(--text-muted); margin: auto; font-size: 14px; }
    .msg { padding: 10px 14px; border-radius: 12px 12px 12px 4px; max-width: 75%; align-self: flex-start; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); font-size: 14px; line-height: 1.5; }
    .msg.self { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); }
    .msg .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-mono); }

    .chat-form-wrap { padding: 12px 20px 20px; border-top: 1px solid var(--glass-border); }
    .chat-form { position: relative; }
    .chat-form textarea { width: 100%; resize: none; min-height: 52px; max-height: 160px; padding: 14px 48px 14px 16px; line-height: 1.5; font-family: var(--font-body); font-size: 14px; background: rgba(0,0,0,0.35); border: 1px solid var(--glass-stroke); border-radius: 12px; color: var(--text); outline: none; transition: border-color 0.2s; }
    .chat-form textarea:focus { border-color: var(--hyper-purple); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .chat-form textarea::placeholder { color: var(--text-muted); }
    .chat-form .chat-send-btn { position: absolute; bottom: 7px; right: 6px; width: 38px; height: 38px; padding: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; background: linear-gradient(135deg, var(--hyper-purple), #7c3aed); color: #fff; transition: transform 0.15s, box-shadow 0.15s; }
    .chat-form .chat-send-btn:hover { transform: scale(1.12); box-shadow: 0 0 14px rgba(168,85,247,0.5); }
    .chat-form .chat-send-btn .material-symbols-outlined { font-size: 18px; }

    .no-chat-selected { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 12px; }
    .no-chat-selected .material-symbols-outlined { font-size: 48px; opacity: 0.3; }
    .no-chat-selected p { font-size: 15px; }

    /* ═══ IMAGE MESSAGES ═══ */
    .msg-image { max-width: 200px; max-height: 200px; border-radius: 8px; cursor: pointer; display: block; margin-bottom: 4px; object-fit: cover; border: 1px solid rgba(255,255,255,0.06); transition: transform 0.2s; }
    .msg-image:hover { transform: scale(1.02); }

    /* ═══ LIGHTBOX ═══ */
    .lightbox-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; padding: 40px; cursor: pointer; animation: fadeIn 0.2s ease; }
    .lightbox-image { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: background 0.2s; }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ═══ VOICE MESSAGES ═══ */
    .voice-msg { max-width: 260px; }
    .voice-player { display: flex; align-items: center; gap: 8px; }
    .voice-play-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(168,85,247,0.2); color: var(--hyper-purple); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
    .voice-play-btn:hover { background: rgba(168,85,247,0.35); }
    .voice-play-btn .material-symbols-outlined { font-size: 18px; }
    .voice-waveform { flex: 1; min-width: 80px; height: 32px; border-radius: 4px; }
    .voice-duration { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); white-space: nowrap; min-width: 32px; }

    /* ═══ CHAT ACTION BUTTONS ═══ */
    .chat-form .chat-attach-btn, .chat-form .chat-mic-btn { position: absolute; bottom: 7px; width: 34px; height: 34px; padding: 0; border: none; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: color 0.2s, background 0.2s; z-index: 2; }
    .chat-form .chat-attach-btn:hover, .chat-form .chat-mic-btn:hover { color: var(--hyper-purple); background: rgba(168,85,247,0.08); }
    .chat-form .chat-attach-btn .material-symbols-outlined, .chat-form .chat-mic-btn .material-symbols-outlined { font-size: 18px; }
    .chat-form .chat-attach-btn { right: 48px; }
    .chat-form .chat-mic-btn { right: 82px; }
    .chat-form .chat-attach-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ═══ RECORDING BAR ═══ */
    .voice-recording-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(0,0,0,0.35); border: 1px solid var(--competitive-red, #FF3B81); border-radius: 12px; margin-bottom: 8px; animation: pulseBorder 1.5s ease-in-out infinite; }
    @keyframes pulseBorder { 0%,100% { border-color: var(--competitive-red, #FF3B81); } 50% { border-color: rgba(255,59,129,0.4); } }
    .recording-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--competitive-red, #FF3B81); animation: blink 1s step-end infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .recording-timer { font-family: var(--font-mono); font-size: 14px; color: var(--text); flex: 1; }
    .recording-actions { display: flex; gap: 6px; }
    .recording-cancel-btn, .recording-stop-btn { width: 34px; height: 34px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .recording-cancel-btn { background: rgba(255,255,255,0.08); color: var(--text-muted); }
    .recording-stop-btn { background: var(--competitive-red, #FF3B81); color: #fff; }
    .recording-cancel-btn:hover, .recording-stop-btn:hover { transform: scale(1.1); }
    .recording-cancel-btn .material-symbols-outlined, .recording-stop-btn .material-symbols-outlined { font-size: 18px; }

    /* ═══ VOICE PREVIEW BAR ═══ */
    .voice-preview-bar { display: none; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(0,0,0,0.35); border: 1px solid var(--hyper-purple); border-radius: 12px; margin-bottom: 8px; }
    .preview-play-btn { width: 34px; height: 34px; border: none; border-radius: 50%; background: var(--hyper-purple); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s; }
    .preview-play-btn:hover { transform: scale(1.1); }
    .preview-play-btn .material-symbols-outlined { font-size: 18px; }
    .preview-waveform { flex: 1; min-width: 80px; height: 32px; border-radius: 4px; }
    .preview-timer { font-family: var(--font-mono); font-size: 14px; color: var(--text); white-space: nowrap; min-width: 40px; }
    .preview-actions { display: flex; gap: 6px; margin-left: auto; }
    .preview-cancel-btn, .preview-send-btn { width: 34px; height: 34px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .preview-cancel-btn { background: rgba(255,255,255,0.08); color: var(--text-muted); }
    .preview-send-btn { background: var(--hyper-purple); color: #fff; }
    .preview-cancel-btn:hover, .preview-send-btn:hover { transform: scale(1.1); }
    .preview-cancel-btn .material-symbols-outlined, .preview-send-btn .material-symbols-outlined { font-size: 18px; }

    /* ═══ VIDEO CALL OVERLAY ═══ */
    .video-call-overlay { position: fixed; inset: 0; z-index: 9000; background: #000; display: flex; align-items: center; justify-content: center; }
    .call-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .remote-video { width: 100%; height: 100%; object-fit: contain; background: #0a0a0a; }
    .local-video { position: absolute; bottom: 100px; right: 20px; width: 160px; height: 120px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: #1a1a2e; z-index: 10; }
    .call-info { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 10; }
    .call-status { color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500; }
    .call-timer { font-family: var(--font-mono); font-size: 16px; color: #fff; }
    .call-controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; z-index: 10; }
    .call-btn { width: 48px; height: 48px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.2s; background: rgba(255,255,255,0.12); color: #fff; }
    .call-btn:hover { transform: scale(1.1); }
    .call-btn .material-symbols-outlined { font-size: 22px; }
    .call-end-btn { background: var(--competitive-red, #FF3B81); width: 56px; height: 56px; }
    .call-end-btn:hover { background: #e02d6a; }
    .call-btn-off { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }

    /* ═══ INCOMING CALL OVERLAY ═══ */
    .incoming-call-overlay { position: fixed; inset: 0; z-index: 9500; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); animation: fadeIn 0.3s ease; }
    .incoming-call-card { background: rgba(11,16,32,0.95); border: 1px solid var(--glass-stroke); border-radius: 20px; padding: 32px; text-align: center; max-width: 320px; width: 90%; }
    .incoming-call-info { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
    .incoming-call-icon { font-size: 48px; color: var(--hyper-purple); }
    .incoming-caller-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); }
    .incoming-call-status { font-size: 13px; color: var(--text-muted); }
    .incoming-call-actions { display: flex; gap: 24px; justify-content: center; }
    .call-answer-btn { background: var(--hyper-purple); color: #fff; width: 56px; height: 56px; }
    .call-answer-btn:hover { transform: scale(1.1); }
    .call-decline-btn { background: var(--competitive-red, #FF3B81); width: 56px; height: 56px; }
    .call-decline-btn:hover { transform: scale(1.1); }

    .chat-header-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .chat-video-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; }
    .chat-video-btn:hover { background: rgba(255,255,255,0.06); color: var(--hyper-purple); }
    .chat-video-btn .material-symbols-outlined { font-size: 20px; }

    @media (max-width: 600px) {
      .local-video { width: 100px; height: 75px; right: 10px; bottom: 80px; }
      .call-btn { width: 40px; height: 40px; }
      .call-end-btn { width: 48px; height: 48px; }
      .call-answer-btn, .call-decline-btn { width: 48px; height: 48px; }
    }

    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-area { padding-bottom: 56px; }
      .bottom-nav { display: flex; }
      .conv-list { width: 100%; }
      .conv-list.hidden { display: none; }
      .chat-panel .chat-header .back-btn { display: flex; }
      .no-chat-selected { display: flex; }
    }
    /* ─── Recruitment Cards ─── */
    .permission-card, .offer-card { max-width: 100% !important; align-self: center; background: transparent !important; border: none !important; }
    .perm-card { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.25); border-radius: 12px; min-width: 300px; }
    .perm-card .perm-icon { font-size: 22px; color: var(--hyper-purple); flex-shrink: 0; }
    .perm-card .perm-text { flex: 1; }
    .perm-card .perm-text strong { display: block; font-family: var(--font-display); font-size: 13px; color: var(--text); }
    .perm-card .perm-text p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .perm-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 6px; flex-shrink: 0; }
    .perm-badge.pending { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
    .perm-badge.approved { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .perm-badge.declined, .perm-badge.revoked { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .offer-card-inner { background: rgba(168,85,247,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; min-width: 320px; }
    .offer-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(168,85,247,0.1); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .offer-header .offer-icon { font-size: 18px; color: var(--hyper-purple); }
    .offer-header strong { font-family: var(--font-display); font-size: 13px; flex: 1; }
    .offer-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; }
    .offer-badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .offer-badge.accepted { background: rgba(34,197,94,0.15); color: #22c55e; }
    .offer-badge.declined { background: rgba(239,68,68,0.15); color: #ef4444; }
    .offer-badge.expired { background: rgba(100,116,139,0.15); color: #64748b; }
    .offer-details { padding: 10px 14px; }
    .offer-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }
    .offer-row span { color: var(--text-muted); }
    .offer-row.notes { flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 4px; }
    .offer-row.notes p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .recruit-bar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-top: 1px solid var(--glass-border); background: rgba(168,85,247,0.05); }
    .recruit-btn { padding: 7px 16px; font-size: 12px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .recruit-btn.request { background: linear-gradient(135deg, var(--hyper-purple), #9333EA); color: #fff; }
    .recruit-btn.request:hover { transform: scale(1.03); box-shadow: 0 0 16px rgba(168,85,247,0.4); }
    .recruit-btn.request:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .recruit-btn.approved { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); cursor: default; }
    .recruit-btn.declined { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); cursor: default; }
    .recruit-status { font-size: 11px; color: var(--text-muted); }

    /* Permission action buttons (player side) */
    .perm-actions { display: flex; gap: 8px; margin-top: 8px; }
    .perm-actions .allow-btn { padding: 6px 14px; font-size: 11px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 6px; cursor: pointer; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; transition: all 0.2s; }
    .perm-actions .allow-btn:hover { transform: scale(1.05); }
    .perm-actions .decline-btn { padding: 6px 14px; font-size: 11px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 6px; cursor: pointer; background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); transition: all 0.2s; }
    .perm-actions .decline-btn:hover { background: rgba(239,68,68,0.25); }
    .perm-actions button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Offer action buttons (player side) */
    .offer-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .offer-actions .accept-btn { padding: 7px 16px; font-size: 11px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 6px; cursor: pointer; background: linear-gradient(135deg, var(--neon, #00f5a0), #00d4aa); color: #04120c; transition: all 0.2s; }
    .offer-actions .accept-btn:hover { transform: scale(1.05); }
    .offer-actions .decline-offer-btn { padding: 7px 16px; font-size: 11px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 6px; cursor: pointer; background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); transition: all 0.2s; }
    .offer-actions .decline-offer-btn:hover { background: rgba(239,68,68,0.25); }
    .offer-actions button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Offer send form */
    .offer-form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .offer-form-modal { background: var(--graphite); border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px; width: 420px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
    .offer-form-modal h3 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .offer-form-modal .ff { margin-bottom: 12px; }
    .offer-form-modal .ff label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .offer-form-modal .ff input, .offer-form-modal .ff textarea { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; }
    .offer-form-modal .ff input:focus, .offer-form-modal .ff textarea:focus { border-color: var(--hyper-purple); }
    .offer-form-modal .ff textarea { resize: vertical; min-height: 60px; }
    .offer-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .offer-form-actions button { padding: 8px 18px; font-size: 12px; font-weight: 600; font-family: var(--font-display); border: none; border-radius: 8px; cursor: pointer; }
    .offer-form-actions .cancel-offer-btn { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .offer-form-actions .send-offer-btn { background: linear-gradient(135deg, var(--hyper-purple), #9333EA); color: #fff; }
    .offer-form-actions .send-offer-btn:hover { box-shadow: 0 0 12px rgba(168,85,247,0.4); }
    .offer-form-actions .send-offer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .typing-indicator {
      padding: 4px 20px 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .typing-indicator .typing-name {
      font-weight: 600;
      color: var(--toxic-lime);
    }
    .typing-indicator .typing-dots span {
      animation: blinkDot 1.4s infinite both;
      font-size: 16px;
      line-height: 1;
    }
    .typing-indicator .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blinkDot {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .top-nav .nav-links { display: none; }
    }
  </style>
</head>
<body class="shell-scout">

    <main class="main-area">
      <div class="msgs-layout">
        <div class="conv-list" id="convList">
          <div class="conv-list-header">
            <h2>Messages</h2>
            <p>Your conversations</p>
          </div>
          <div class="conv-items" id="convItems"></div>
        </div>

        <div class="chat-panel" id="chatPanel">
          <div class="no-chat-selected" id="emptyState">
            <span class="material-symbols-outlined">chat</span>
            <p>Select a conversation to start chatting</p>
          </div>

          <div id="activeChat" style="display:none;flex-direction:column;height:100%;">
            <div class="chat-header" id="chatHeader">
              <button class="back-btn material-symbols-outlined" id="mobileBackBtn">arrow_back</button>
              <img id="chatAvatar" src="" alt="">
              <div>
                <div class="chat-name" id="chatName"></div>
                <div class="chat-role" id="chatRole"></div>
              </div>
            </div>
            <div class="chat-msgs" id="chatMessages"></div>
            <div class="typing-indicator" id="typingIndicator" style="display:none;"><span class="typing-name"></span> typing<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span></div>
            <div class="chat-form-wrap">
              <form class="chat-form" id="chatForm">
                <textarea id="chatInput" placeholder="Type a message..." required rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'"></textarea>
                <button type="submit" class="chat-send-btn" aria-label="Send"><span class="material-symbols-outlined">send</span></button>
              </form>
            </div>
            <div class="recruit-bar" id="recruitBar" style="display:none;">
              <button class="recruit-btn request" id="requestPermBtn">Request Recruiting Permission</button>
              <span class="recruit-status" id="recruitStatus"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script type="module">
    import { requireRole } from '../../services/auth.js';
    import { api, API_URL } from '../../services/api.js';
    import { renderMessageHTML, formatMessagePreview, initVoicePlayers, setupImageAttach, setupVoiceRecorder, setupVideoCall } from '../../services/chat.js';
    import { initLayout } from '../../components/layout.js';
    import { getSocket } from '../../services/socket.js';
    initLayout();

    if (!requireRole('scout', 'admin')) throw new Error('unauthorized');

    const me = localStorage.getItem('username') || 'scout';
    const myId = parseInt(localStorage.getItem('userId'), 10);
    const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

    let activeConvId = null;
    let conversations = [];

    const socket = typeof io !== 'undefined' ? getSocket() : null;

    const convItemsEl = document.getElementById('convItems');
    const activeChat = document.getElementById('activeChat');
    const emptyState = document.getElementById('emptyState');
    const chatMessages = document.getElementById('chatMessages');
    const chatName = document.getElementById('chatName');
    const chatRole = document.getElementById('chatRole');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatInput = document.getElementById('chatInput');
    const chatForm = document.getElementById('chatForm');

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (diff < 172800000) return 'Yesterday';
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function renderConvList() {
      convItemsEl.innerHTML = conversations.map(c => `
        <div class="conv-item ${c.id === activeConvId ? 'active' : ''}" data-conv-id="${c.id}">
          <img src="${c.otherUser.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + c.otherUser.username}" alt="">
          <div class="conv-info">
            <div class="conv-name">${esc(c.otherUser.username)}</div>
            <div class="conv-preview">${c.lastMessage ? esc(formatMessagePreview(c.lastMessage)) : 'No messages yet'}</div>
          </div>
          <div class="conv-meta">
            <span class="conv-time">${c.lastMessage ? formatTime(c.lastMessage.createdAt) : formatTime(c.createdAt)}</span>
            ${c.unreadCount > 0 ? `<span class="unread-badge">${c.unreadCount}</span>` : ''}
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.conv-item').forEach(el => {
        el.onclick = () => openConversation(parseInt(el.dataset.convId));
      });
    }

    async function loadConversations() {
      try {
        conversations = await api('/conversations');
      } catch {
        conversations = [];
      }
      renderConvList();
    }

    async function openConversation(convId) {
      activeConvId = convId;

      if (socket) {
        socket.emit('leaveConversation', convId);
        socket.emit('joinConversation', convId);
      }

      const conv = conversations.find(c => c.id === convId);
      if (conv) {
        chatName.textContent = conv.otherUser.username;
        chatRole.textContent = conv.otherUser.role;
        chatAvatar.src = conv.otherUser.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${conv.otherUser.username}`;
      }

      emptyState.style.display = 'none';
      activeChat.style.display = 'flex';

      if (window.innerWidth <= 1024) {
        document.getElementById('convList').classList.add('hidden');
      }

      try {
        await api(`/conversations/${convId}/read`, { method: 'PUT' });
      } catch {}

      loadMessages(convId);
      renderConvList();
    }

    async function loadMessages(convId) {
      let msgs = [];
      try {
        msgs = await api(`/conversations/${convId}/messages`);
      } catch { msgs = []; }

      chatMessages.innerHTML = msgs.length
        ? msgs.map(m => renderMessageHTML(m, myId)).join('')
        : '<div class="empty-state">Start a conversation — say hello!</div>';

      chatMessages.scrollTop = chatMessages.scrollHeight;
      initVoicePlayers(chatMessages);
    }

    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !activeConvId) return;
      chatInput.value = '';
      chatInput.style.height = 'auto';

      const msg = { conversationId: activeConvId, senderId: myId, message: text, messageType: 'text' };
      appendMessage(msg);

      if (socket && socket.connected) {
        socket.emit('chatMessage', msg);
      } else {
        try {
          const saved = await api(`/conversations/${activeConvId}/messages`, { method: 'POST', body: JSON.stringify({ message: text, messageType: 'text' }) });
          if (saved?.id) {
            document.querySelector(`[data-msg-id="${-Date.now()}"]`)?.setAttribute('data-msg-id', saved.id);
          }
        } catch {}
      }
    };

    const typingIndicator = document.getElementById('typingIndicator');
    const typingName = typingIndicator?.querySelector('.typing-name');
    let typingTimeout = null;
    let otherUserId = null;

    function showTyping(username) {
      if (!typingIndicator || !typingName) return;
      typingName.textContent = username || 'Someone';
      typingIndicator.style.display = 'flex';
    }

    function hideTyping() {
      if (!typingIndicator) return;
      typingIndicator.style.display = 'none';
    }

    if (socket) {
      socket.on('chatMessage', (msg) => {
        if (msg.sender_id === myId) return;
        if (msg.conversation_id === activeConvId) {
          chatMessages.innerHTML += renderMessageHTML(msg, myId);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          initVoicePlayers(chatMessages);
          api(`/conversations/${activeConvId}/read`, { method: 'PUT' }).catch(() => {});
          hideTyping();
        }
        updateConvItemLastMessage(msg);
      });

      socket.on('unreadUpdate', (data) => {
        const { message, conversationId } = data;
        if (!message || !conversationId) return;
        if (conversationId === activeConvId) {
          chatMessages.innerHTML += renderMessageHTML(message, myId);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          initVoicePlayers(chatMessages);
          api(`/conversations/${activeConvId}/read`, { method: 'PUT' }).catch(() => {});
          hideTyping();
        }
        updateConvItemLastMessage(message);
      });

      socket.on('typing:start', (data) => {
        if (data.conversationId === activeConvId && data.userId !== myId) {
          const conv = conversations.find(c => c.id === activeConvId);
          showTyping(conv?.otherUser?.username || 'Someone');
        }
      });

      socket.on('typing:stop', (data) => {
        if (data.conversationId === activeConvId && data.userId !== myId) {
          hideTyping();
        }
      });
    }

    function emitTyping() {
      if (!socket || !activeConvId) return;
      socket.emit('typing:start', { conversationId: activeConvId });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        if (socket && activeConvId) {
          socket.emit('typing:stop', { conversationId: activeConvId });
        }
      }, 2000);
    }

    chatInput.addEventListener('input', () => {
      if (chatInput.value.trim()) {
        emitTyping();
      }
    });

    function updateConvItemLastMessage(msg) {
      const convItem = document.querySelector(`.conv-item[data-conv-id="${msg.conversation_id}"]`);
      if (!convItem) return;
      const preview = convItem.querySelector('.conv-preview');
      if (preview) preview.textContent = formatMessagePreview(msg);
    }

    function appendMessage(msg) {
      const tempMsg = {
        id: -Date.now(),
        conversation_id: msg.conversationId,
        sender_id: msg.senderId,
        message: msg.message || '',
        message_type: msg.messageType || 'text',
        attachment_url: msg.attachmentUrl || '',
        waveform: msg.waveform || '',
        created_at: new Date().toISOString(),
      };
      chatMessages.innerHTML += renderMessageHTML(tempMsg, myId);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      initVoicePlayers(chatMessages);
    }

    function getActiveConvId() { return activeConvId; }
    function getSocket() { return socket; }
    function getMyId() { return myId; }

    if (chatForm) {
      setupImageAttach({
        chatForm,
        getActiveConvId,
        getMyId,
        getSocket,
        appendMessage,
        onMessageSent: loadConversations,
      });
      setupVoiceRecorder({
        chatForm,
        getActiveConvId,
        getMyId,
        getSocket,
        appendMessage,
        onMessageSent: loadConversations,
      });
    }

    const chatHeader = document.getElementById('chatHeader');
    if (chatHeader) {
      setupVideoCall({
        chatHeader,
        getActiveConvId,
        getSocket,
        getMyId,
      });
    }

    document.getElementById('mobileBackBtn').onclick = () => {
      activeChat.style.display = 'none';
      emptyState.style.display = 'flex';
      document.getElementById('convList').classList.remove('hidden');
    };

    // ─── RECRUITMENT ──────────────────────────────────────────
    const recruitBar = document.getElementById('recruitBar');
    const requestPermBtn = document.getElementById('requestPermBtn');
    const recruitStatus = document.getElementById('recruitStatus');
    let currentPermStatus = null;
    let currentOtherUserId = null;

    async function checkPermissionStatus(playerId) {
      try {
        const perm = await api(`/recruitment/permissions/status/${playerId}`);
        if (perm) {
          currentPermStatus = perm.status;
          updateRecruitBar(perm.status, perm.id);
        } else {
          currentPermStatus = null;
          updateRecruitBar(null);
        }
      } catch {
        currentPermStatus = null;
        updateRecruitBar(null);
      }
    }

    function updateRecruitBar(status, permId) {
      if (!currentOtherUserId) { recruitBar.style.display = 'none'; return; }
      recruitBar.style.display = 'flex';
      if (status === 'approved') {
        requestPermBtn.textContent = 'Permission Approved';
        requestPermBtn.className = 'recruit-btn approved';
        requestPermBtn.disabled = false;
        requestPermBtn.onclick = () => showOfferForm(permId);
        recruitStatus.textContent = 'You can send a team offer';
      } else if (status === 'pending') {
        requestPermBtn.textContent = 'Permission Requested';
        requestPermBtn.className = 'recruit-btn request';
        requestPermBtn.disabled = true;
        recruitStatus.textContent = 'Waiting for player response...';
      } else if (status === 'declined' || status === 'revoked') {
        requestPermBtn.textContent = status === 'declined' ? 'Permission Declined' : 'Permission Revoked';
        requestPermBtn.className = 'recruit-btn declined';
        requestPermBtn.disabled = true;
        recruitStatus.textContent = 'You can try requesting again later';
      } else {
        requestPermBtn.textContent = 'Request Recruiting Permission';
        requestPermBtn.className = 'recruit-btn request';
        requestPermBtn.disabled = false;
        requestPermBtn.onclick = requestPermission;
        recruitStatus.textContent = '';
      }
    }

    async function requestPermission() {
      if (!currentOtherUserId) return;
      requestPermBtn.disabled = true;
      requestPermBtn.textContent = 'Sending...';
      try {
        const rp = await api('/recruitment/permissions/request', {
          method: 'POST',
          body: JSON.stringify({ playerId: currentOtherUserId }),
        });
        currentPermStatus = 'pending';
        updateRecruitBar('pending', rp.id);
        // Send system message in chat
        if (socket) {
          const sysMsg = {
            conversationId: activeConvId,
            senderId: myId,
            message: JSON.stringify({ permissionId: rp.id, status: 'pending' }),
            messageType: 'permission_request',
          };
          socket.emit('chatMessage', sysMsg);
          appendMessage(sysMsg);
        }
      } catch (err) {
        requestPermBtn.disabled = false;
        requestPermBtn.textContent = 'Request Recruiting Permission';
        alert(err.message || 'Failed to request permission');
      }
    }

    function showOfferForm(permId) {
      const overlay = document.createElement('div');
      overlay.className = 'offer-form-overlay';
      overlay.innerHTML = `
        <div class="offer-form-modal">
          <h3>Send Team Offer</h3>
          <div class="ff"><label>Team Name</label><input type="text" id="offerTeamName" placeholder="e.g. Team Liquid" required></div>
          <div class="ff"><label>Role</label><input type="text" id="offerRole" placeholder="e.g. Entry Fragger" required></div>
          <div class="ff"><label>Tournament Focus</label><input type="text" id="offerTournament" placeholder="e.g. ESL Pro League"></div>
          <div class="ff"><label>Contract Duration</label><input type="text" id="offerContract" placeholder="e.g. 6 months"></div>
          <div class="ff"><label>Prize Share (%)</label><input type="number" id="offerPrize" placeholder="e.g. 20" min="0" max="100"></div>
          <div class="ff"><label>Notes</label><textarea id="offerNotes" placeholder="Any additional details..."></textarea></div>
          <div class="offer-form-actions">
            <button class="cancel-offer-btn" id="cancelOfferBtn">Cancel</button>
            <button class="send-offer-btn" id="sendOfferBtn">Send Offer</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      overlay.querySelector('#cancelOfferBtn').onclick = () => overlay.remove();
      overlay.querySelector('#sendOfferBtn').onclick = async () => {
        const teamName = overlay.querySelector('#offerTeamName').value.trim();
        const role = overlay.querySelector('#offerRole').value.trim();
        if (!teamName || !role) { alert('Team name and role are required'); return; }
        overlay.querySelector('#sendOfferBtn').disabled = true;
        overlay.querySelector('#sendOfferBtn').textContent = 'Sending...';
        try {
          const offer = await api('/recruitment/offers/send', {
            method: 'POST',
            body: JSON.stringify({
              playerId: currentOtherUserId,
              teamName,
              role,
              tournamentFocus: overlay.querySelector('#offerTournament').value.trim(),
              contractDuration: overlay.querySelector('#offerContract').value.trim(),
              prizeShare: parseFloat(overlay.querySelector('#offerPrize').value) || 0,
              notes: overlay.querySelector('#offerNotes').value.trim(),
            }),
          });
          overlay.remove();
          if (socket) {
            const sysMsg = {
              conversationId: activeConvId,
              senderId: myId,
              message: JSON.stringify(offer),
              messageType: 'team_offer',
            };
            socket.emit('chatMessage', sysMsg);
            appendMessage(sysMsg);
          }
        } catch (err) {
          alert(err.message || 'Failed to send offer');
          overlay.querySelector('#sendOfferBtn').disabled = false;
          overlay.querySelector('#sendOfferBtn').textContent = 'Send Offer';
        }
      };
    }

    if (socket) {
      socket.on('permissionResponse', (data) => {
        const playerId = data.player_id;
        if (playerId === currentOtherUserId) {
          currentPermStatus = data.status;
          updateRecruitBar(data.status, data.id);
          loadConversations();
          // Remove old permission cards with this ID (deduplication)
          document.querySelectorAll(`.permission-card[data-perm-id="${data.id}"]`).forEach(el => el.remove());
          if (activeConvId) {
            const sysMsg = {
              conversationId: activeConvId,
              senderId: myId,
              message: JSON.stringify({ permissionId: data.id, status: data.status }),
              messageType: 'permission_request',
              created_at: new Date().toISOString(),
            };
            chatMessages.innerHTML += renderMessageHTML(sysMsg, myId);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        }
      });

      socket.on('offerResponse', (data) => {
        if (data.player_id === currentOtherUserId) {
          loadConversations();
          // Remove old offer card entirely
          document.querySelectorAll(`.offer-card[data-offer-id="${data.id}"]`).forEach(el => el.remove());
          // Show system message about the response
          const action = data.status === 'accepted' ? 'accepted' : 'declined';
          const detail = data.status === 'accepted'
            ? `Player accepted your offer and joined ${data.team_name || 'the team'}!`
            : 'Player declined the offer.';
          const sysMsg = {
            conversationId: activeConvId,
            senderId: myId,
            message: JSON.stringify({ action, detail }),
            messageType: 'offer_change',
            created_at: new Date().toISOString(),
          };
          chatMessages.innerHTML += renderMessageHTML(sysMsg, myId);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          if (data.status === 'accepted') {
            currentPermStatus = 'approved';
            updateRecruitBar('approved');
            recruitStatus.textContent = 'Offer accepted! Player has joined your team.';
          } else {
            currentPermStatus = null;
            updateRecruitBar(null);
            recruitStatus.textContent = 'Offer declined. You can try again later.';
          }
        }
      });
    }

    // Override openConversation to check permission status
    const _origOpenConv = openConversation;
    openConversation = async function(convId) {
      await _origOpenConv(convId);
      const conv = conversations.find(c => c.id === convId);
      if (conv && conv.otherUser && conv.otherUser.role === 'player') {
        currentOtherUserId = conv.otherUser.id;
        checkPermissionStatus(currentOtherUserId);
      } else {
        currentOtherUserId = null;
        recruitBar.style.display = 'none';
      }
    };

    const params = new URLSearchParams(window.location.search);
    const openConvId = params.get('conv');

    await loadConversations();

    if (openConvId) {
      const conv = conversations.find(c => c.id === parseInt(openConvId, 10));
      if (conv) {
        openConversation(conv.id);
      } else {
        setTimeout(async () => {
          await loadConversations();
          const c = conversations.find(x => x.id === parseInt(openConvId, 10));
          if (c) openConversation(c.id);
        }, 500);
      }
    }
  </script>
  <script type="module" src="../../services/notification.js"></script>
</body>
</html>
