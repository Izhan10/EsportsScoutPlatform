<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search Players · PakEsports Scout PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --obsidian: #070B14;
      --graphite: #0B1020;
      --hyper-purple: #A855F7;
      --toxic-lime: #A3FF12;
      --electric-teal: #06B6D4;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-stroke: rgba(255, 255, 255, 0.08);
      --text: #dfe2f0;
      --text-muted: rgba(255, 255, 255, 0.4);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --sidebar-w: 260px;
      --nav-h: 60px;
      --font-display: 'Sora', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--obsidian);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ═══════════ TOP NAV ═══════════ */
    .top-nav {
      display: flex;
      align-items: center;
      height: var(--nav-h);
      padding: 0 20px;
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(40px);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
      z-index: 100;
      gap: 0;
    }

    .top-nav .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--toxic-lime), var(--electric-teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      margin-right: 32px;
    }

    .top-nav .brand small {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      -webkit-text-fill-color: var(--text-muted);
      color: var(--text-muted);
      background: none;
      margin-left: 4px;
    }

    .top-nav .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .top-nav .nav-links a {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .top-nav .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .top-nav .nav-links a.active { color: var(--toxic-lime); background: rgba(163,255,18,0.08); }

    .top-nav .icon-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 16px;
    }

    .top-nav .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .top-nav .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    .top-nav .icon-btn .material-symbols-outlined { font-size: 20px; }

    .top-nav .notif-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--competitive-red, #FF3B81);
      box-shadow: 0 0 8px rgba(255,59,129,0.6);
    }

    .top-nav .notif-btn { position: relative; }

    /* ═══════════ LAYOUT ═══════════ */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ═══════════ SIDEBAR ═══════════ */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: rgba(7, 11, 20, 0.95);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 20px 12px 16px;
      overflow-y: auto;
      z-index: 50;
    }

    .sidebar .scout-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 16px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 16px;
    }

    .sidebar .scout-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--toxic-lime);
      box-shadow: 0 0 16px rgba(163,255,18,0.25);
      object-fit: cover;
      flex-shrink: 0;
    }

    .sidebar .scout-info h4 {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .sidebar .scout-info .badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .sidebar .scout-info .badge-row .mode-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(168,85,247,0.15);
      color: var(--hyper-purple);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .sidebar .scout-info .badge-row .level-badge {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(6,182,212,0.12);
      color: var(--electric-teal);
      border: 1px solid rgba(6,182,212,0.2);
    }

    .sidebar .nav-section {
      margin-bottom: 20px;
    }

    .sidebar .nav-section .section-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }

    .sidebar .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .sidebar .nav-item .material-symbols-outlined { font-size: 18px; }

    .sidebar .nav-item.active {
      background: rgba(163,255,18,0.06);
      color: var(--toxic-lime);
      border-left: 2px solid var(--toxic-lime);
      border-radius: 0 8px 8px 0;
      margin-left: -2px;
      padding-left: 12px;
    }

    .sidebar .nav-item.active .material-symbols-outlined { color: var(--toxic-lime); }

    .sidebar .spacer { flex: 1; }

    .sidebar .bottom-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar .bottom-item:hover { background: rgba(255,255,255,0.04); color: var(--text-secondary); }
    .sidebar .bottom-item .material-symbols-outlined { font-size: 18px; }

    /* ═══════════ MAIN CONTENT ═══════════ */
    .main-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      padding-bottom: 100px;
      position: relative;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .page-header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Search Filters Panel */
    .filters-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding: 16px 20px;
      background: rgba(11,16,32,0.7);
      backdrop-filter: blur(40px);
      border: 1px solid var(--glass-stroke);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .filters-panel .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
      min-width: 130px;
    }

    .filters-panel .field label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .filters-panel select,
    .filters-panel input {
      padding: 8px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      margin: 0;
      width: 100%;
    }

    .filters-panel select:focus,
    .filters-panel input:focus {
      border-color: var(--hyper-purple);
      background: rgba(168,85,247,0.06);
    }

    .filters-panel select option { background: var(--obsidian); color: var(--text); }

    .filters-panel .search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 22px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--hyper-purple), #7c3aed);
      color: #fff;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      white-space: nowrap;
      height: 37px;
    }

    .filters-panel .search-btn:hover {
      box-shadow: 0 0 24px rgba(168,85,247,0.3);
      transform: translateY(-1px);
    }

    .filters-panel .search-btn .material-symbols-outlined { font-size: 16px; }

    /* Results Grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .player-card {
      background: rgba(11,16,32,0.7);
      backdrop-filter: blur(40px);
      border: 1px solid var(--glass-stroke);
      border-radius: 14px;
      padding: 20px;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .player-card:hover {
      border-color: rgba(163,255,18,0.3);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(163,255,18,0.1);
    }

    .player-card h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .player-card .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .player-card .esv-row {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--hyper-purple);
      margin: 8px 0;
    }

    .player-card .sub-row {
      font-size: 13px;
      color: var(--text-muted);
    }

    .player-card .shortlist-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .player-card .shortlist-btn:hover {
      border-color: var(--hyper-purple);
      color: var(--hyper-purple);
      background: rgba(168,85,247,0.06);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .material-symbols-outlined {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--glass-border);
    }

    /* ═══════════ BOTTOM NAV (mobile) ═══════════ */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(7,11,20,0.95);
      backdrop-filter: blur(40px);
      border-top: 1px solid var(--glass-border);
      z-index: 200;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      padding: 4px 0;
    }

    .bottom-nav a .material-symbols-outlined { font-size: 20px; }
    .bottom-nav a.active { color: var(--toxic-lime); }
    .bottom-nav a:hover { color: var(--text-secondary); }

    /* ═══════════ RESPONSIVE ═══════════ */
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-area { padding: 18px 16px; }
      .bottom-nav { display: flex; }
      .filters-panel .field { min-width: 100px; }
    }

    @media (max-width: 600px) {
      .top-nav .nav-links { display: none; }
      .filters-panel { flex-direction: column; align-items: stretch; }
      .filters-panel select,
      .filters-panel input { min-width: 0; width: 100%; }
      .filters-panel .search-btn { width: 100%; justify-content: center; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body class="shell-scout">

    <main class="main-area">

      <div class="page-header">
        <div>
          <h1>Search players</h1>
          <p>Data-driven talent discovery across Pakistan</p>
        </div>
      </div>

      <div class="filters-panel">
        <div class="field">
          <label>Username</label>
          <input type="text" id="q" placeholder="Username">
        </div>
        <div class="field">
          <label>Game</label>
          <select id="game">
            <option value="">All Games</option>
            <option value="Valorant">Valorant</option>
            <option value="PUBG Mobile">PUBG Mobile</option>
            <option value="CS2">CS2</option>
            <option value="Fortnite">Fortnite</option>
          </select>
        </div>
        <div class="field">
          <label>City</label>
          <input type="text" id="city" placeholder="City">
        </div>
        <div class="field">
          <label>Rank</label>
          <input type="text" id="rank" placeholder="Rank">
        </div>
        <div class="field">
          <label>Min ESV</label>
          <input type="number" id="score" placeholder="Min ESV">
        </div>
        <button class="search-btn" id="searchBtn">
          <span class="material-symbols-outlined">search</span>
          SEARCH
        </button>
      </div>

      <div class="results-grid" id="results"></div>

    </main>

  <script type="module">
    import { requireRole } from '../../services/auth.js';
    import { api } from '../../services/api.js';
    import { initLayout } from '../../components/layout.js';
    initLayout();

    if (!requireRole('scout', 'admin')) throw new Error('unauthorized');

    async function search() {
      const qs = new URLSearchParams({
        q: document.getElementById('q').value,
        game: document.getElementById('game').value,
        city: document.getElementById('city').value,
        rank: document.getElementById('rank').value,
        score: document.getElementById('score').value,
      });
      let players = [];
      try {
        players = await api(`/scout/search?${qs}`);
      } catch {
        players = [];
        console.error('Search failed — no data available');
      }
      const el = document.getElementById('results');
      if (!players.length) {
        el.innerHTML = '<p style="color:var(--muted);">No players found.</p>';
        return;
      }
      el.innerHTML = players.map((p) => `
        <div class="glass-card">
          <a href="../player/public-profile.html?id=${p.id}" style="color:inherit;text-decoration:none;">
            <h3>@${p.username || p.name}</h3>
            <p><span class="badge">${p.game}</span> <span class="badge">${p.rank || ''}</span></p>
            <p style="margin:0.5rem 0;color:#c4b5fd;">ESV ${p.esv_score ?? p.esv}</p>
            <p style="color:var(--muted);font-size:0.85rem;">${p.city} · ${p.clip_count || 0} clips</p>
          </a>
          <button class="btn btn-neon" style="margin-top:0.75rem;width:100%;background:linear-gradient(135deg,#7c3aed,#06b6d4);" data-id="${p.id}" data-shortlist>☆ Shortlist</button>
        </div>`).join('');

      el.querySelectorAll('[data-shortlist]').forEach((btn) => {
        btn.onclick = async () => {
          try {
            await api(`/scout/shortlist/${btn.dataset.id}`, { method: 'POST' });
            btn.textContent = '★ Shortlisted';
          } catch { btn.textContent = '★ Shortlisted'; }
        };
      });
    }

    document.getElementById('searchBtn').onclick = search;
    search();
  </script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script type="module" src="../../services/notification.js"></script>
</body>
</html>
