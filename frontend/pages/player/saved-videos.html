<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Saved Videos · PakEsports Scout PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--deep-obsidian); color: var(--on-surface); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    :root { --sidebar-w: 240px; --nav-h: 60px; }

    .top-nav { display: flex; align-items: center; height: var(--nav-h); padding: 0 20px; background: rgba(7,11,20,0.9); backdrop-filter: blur(40px); border-bottom: 1px solid var(--glass-stroke); flex-shrink: 0; z-index: 100; gap: 0; }
    .top-nav .brand { font-family: var(--font-headline); font-weight: 800; font-size: 15px; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--toxic-lime), var(--electric-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; margin-right: 32px; }
    .top-nav .nav-links { display: flex; align-items: center; gap: 4px; }
    .top-nav .nav-links a { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); border-radius: 8px; transition: background 0.2s, color 0.2s; white-space: nowrap; }
    .top-nav .nav-links a:hover { color: var(--on-surface); background: rgba(255,255,255,0.04); }
    .top-nav .nav-links a.active { color: var(--toxic-lime); background: rgba(163,255,18,0.08); }
    .top-nav .icon-group { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .top-nav .icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--on-surface-variant); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; position: relative; }
    .top-nav .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--on-surface); }
    .top-nav .icon-btn .material-symbols-outlined { font-size: 20px; }

    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: rgba(7,11,20,0.95); border-right: 1px solid var(--glass-stroke); display: flex; flex-direction: column; padding: 20px 12px 16px; overflow-y: auto; z-index: 50; }
    .sidebar .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid var(--glass-stroke); margin-bottom: 16px; }
    .sidebar .sidebar-header .material-symbols-outlined { font-size: 22px; color: var(--toxic-lime); }
    .sidebar .sidebar-header .sidebar-title { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--toxic-lime); }
    .sidebar .nav-section { margin-bottom: 20px; }
    .sidebar .nav-section .section-label { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-surface-variant); padding: 0 8px; margin-bottom: 6px; }
    .sidebar .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer; transition: background 0.2s, color 0.2s; text-decoration: none; }
    .sidebar .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--on-surface); }
    .sidebar .nav-item .material-symbols-outlined { font-size: 18px; }
    .sidebar .nav-item.active { background: rgba(163,255,18,0.06); color: var(--toxic-lime); border-left: 2px solid var(--toxic-lime); border-radius: 0 8px 8px 0; margin-left: -2px; padding-left: 12px; }
    .sidebar .nav-item.active .material-symbols-outlined { color: var(--toxic-lime); }
    .sidebar .spacer { flex: 1; }
    .sidebar .bottom-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer; transition: background 0.2s, color 0.2s; text-decoration: none; }
    .sidebar .bottom-item:hover { background: rgba(255,255,255,0.04); color: var(--on-surface-variant); }
    .sidebar .bottom-item .material-symbols-outlined { font-size: 18px; }

    .main-area { flex: 1; overflow-y: auto; padding: 28px; padding-bottom: 100px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }
    .page-header h1 { font-family: var(--font-headline); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .video-card { background: rgba(11, 16, 32, 0.6); border: 1px solid var(--glass-stroke); border-radius: 14px; overflow: hidden; transition: border-color 0.3s, transform 0.2s; }
    .video-card:hover { border-color: rgba(163,255,18,0.3); transform: translateY(-2px); }
    .video-card .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--graphite); display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); overflow: hidden; }
    .video-card .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .video-card .thumb-wrap .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); opacity: 0; transition: opacity 0.2s; cursor: pointer; }
    .video-card .thumb-wrap:hover .play-overlay { opacity: 1; }
    .video-card .thumb-wrap .play-overlay .material-symbols-outlined { font-size: 40px; color: #fff; }
    .video-card .card-body { padding: 12px 14px 14px; }
    .video-card .card-body .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .video-card .card-body .user-row img { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--glass-stroke); }
    .video-card .card-body .user-row span { font-size: 13px; font-weight: 600; color: var(--on-surface); }
    .video-card .card-body .caption { font-size: 13px; color: var(--on-surface); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
    .video-card .card-body .meta-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--on-surface-variant); margin-bottom: 8px; flex-wrap: wrap; }
    .video-card .card-body .meta-row .game-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(163,255,18,0.1); color: var(--toxic-lime); border: 1px solid rgba(163,255,18,0.15); }
    .video-card .card-body .meta-row .rank-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(168,85,247,0.1); color: var(--hyper-purple); border: 1px solid rgba(168,85,247,0.15); }
    .video-card .card-body .stats-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--on-surface-variant); }
    .video-card .card-body .stats-row .esv { font-family: var(--font-mono); font-weight: 700; color: var(--toxic-lime); margin-right: auto; }
    .video-card .card-body .stats-row .stat-item { display: flex; align-items: center; gap: 3px; }
    .video-card .card-body .stats-row .stat-item .material-symbols-outlined { font-size: 14px; }
    .video-card .card-body .unsave-btn { margin-top: 10px; width: 100%; padding: 7px; border: 1px solid var(--glass-stroke); border-radius: 8px; background: transparent; color: var(--on-surface-variant); font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .video-card .card-body .unsave-btn:hover { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.2); }
    .video-card .card-body .unsave-btn .material-symbols-outlined { font-size: 14px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--on-surface-variant); }
    .empty-state .material-symbols-outlined { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--on-surface); }
    .empty-state p { font-size: 13px; margin-bottom: 16px; }
    .empty-state a { color: var(--toxic-lime); font-weight: 600; }

    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: rgba(7,11,20,0.95); backdrop-filter: blur(40px); border-top: 1px solid var(--glass-stroke); z-index: 200; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom, 0); }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--on-surface-variant); font-size: 9px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; padding: 4px 0; text-decoration: none; }
    .bottom-nav a .material-symbols-outlined { font-size: 20px; }
    .bottom-nav a.active { color: var(--toxic-lime); }
    .bottom-nav a:hover { color: var(--on-surface-variant); }

    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-area { padding: 18px 16px; }
      .bottom-nav { display: flex; }
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }
    @media (max-width: 600px) {
      .top-nav .nav-links { display: none; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="shell-player">

    <main class="main-area">
      <div class="page-header">
        <h1>Saved Videos</h1>
      </div>
      <div id="savedGrid"></div>
    </main>

  <script type="module">
    import { requireRole } from '../../services/auth.js';
    import { api } from '../../services/api.js';
    import { initLayout } from '../../components/layout.js';
    initLayout();

    if (!requireRole('player')) throw new Error('unauthorized');

    const grid = document.getElementById('savedGrid');

    async function loadSaved() {
      try {
        const videos = await api('/videos/saved');
        if (!videos.length) {
          grid.innerHTML = `<div class="empty-state">
            <span class="material-symbols-outlined">bookmark</span>
            <h3>No saved videos yet</h3>
            <p>Browse the Feed to find clips you like and save them for later.</p>
            <a href="feed.html">Browse Feed →</a>
          </div>`;
          return;
        }
        grid.innerHTML = '<div class="video-grid">' + videos.map(v => {
          const thumb = v.thumbnailUrl ? `<img src="${v.thumbnailUrl}" alt="" loading="lazy">` : `<span class="material-symbols-outlined" style="font-size:40px;">play_circle</span>`;
          const avatar = v.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${v.username}`;
          return `<div class="video-card" data-video-id="${v.id}">
            <div class="thumb-wrap" data-play-video="${v.id}">
              ${thumb}
              <div class="play-overlay"><span class="material-symbols-outlined">play_circle</span></div>
            </div>
            <div class="card-body">
              <div class="user-row">
                <img src="${avatar}" alt="">
                <span>${v.username}</span>
              </div>
              ${v.caption ? `<div class="caption">${v.caption}</div>` : ''}
              <div class="meta-row">
                ${v.gameTitle ? `<span class="game-badge">${v.gameTitle}</span>` : ''}
                ${v.rank ? `<span class="rank-badge">${v.rank}</span>` : ''}
              </div>
              <div class="stats-row">
                <span class="esv">ESV ${v.esvScore ?? '—'}</span>
                <span class="stat-item"><span class="material-symbols-outlined">visibility</span> <span class="views-count" data-video-id="${v.id}">${v.views ?? 0}</span></span>
                <span class="stat-item"><span class="material-symbols-outlined">favorite</span> ${v.likes ?? 0}</span>
              </div>
              <button class="unsave-btn" data-unsave="${v.id}"><span class="material-symbols-outlined">bookmark_remove</span> Remove from Saved</button>
            </div>
          </div>`;
        }).join('') + '</div>';
      } catch {
        grid.innerHTML = `<div class="empty-state"><h3>Failed to load saved videos</h3><p>Make sure the backend is running.</p></div>`;
      }
    }

    loadSaved();

    grid.addEventListener('click', async (e) => {
      const unsaveBtn = e.target.closest('[data-unsave]');
      if (unsaveBtn) {
        const videoId = unsaveBtn.dataset.unsave;
        try {
          await api(`/videos/${videoId}/save`, { method: 'POST' });
          const card = unsaveBtn.closest('.video-card');
          card.remove();
          if (!grid.querySelector('.video-card')) {
            grid.innerHTML = `<div class="empty-state">
              <span class="material-symbols-outlined">bookmark</span>
              <h3>No saved videos yet</h3>
              <p>Browse the Feed to find clips you like and save them for later.</p>
              <a href="feed.html">Browse Feed →</a>
            </div>`;
          }
        } catch { alert('Failed to remove'); }
        return;
      }

      const playBtn = e.target.closest('[data-play-video]');
      if (playBtn) {
        const videoId = playBtn.dataset.playVideo;
        if (videoId) window.location.href = `feed.html?play=${videoId}`;
      }
    });
  </script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script type="module" src="../../services/notification.js"></script>
</body>
</html>
