<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feed · PakEsports Scout PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../../styles/feed.css">
  <style>
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }

    .nav-icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(7, 11, 20, 0.95);
      border-right: 1px solid var(--glass-border);
      padding: 1rem 0.75rem;
      overflow-y: auto;
      gap: 0.25rem;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
    }

    .sidebar-icon {
      font-size: 1.5rem;
      color: var(--toxic-lime);
    }

    .sidebar-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--toxic-lime);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
      text-decoration: none;
    }

    .sidebar-link:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    .sidebar-link.active {
      background: rgba(163, 255, 18, 0.08);
      color: var(--toxic-lime);
    }

    .sidebar-link .material-symbols-outlined {
      font-size: 1.25rem;
    }

    .sidebar-link.small {
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--glass-border);
      margin-top: auto;
    }

    .feed-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .action-avatar-link {
      display: block;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.2s;
    }

    .action-avatar-link:hover {
      transform: scale(1.1);
    }

    .action-avatar {
      width: 48px !important;
      height: 48px !important;
      border: 2px solid var(--toxic-lime) !important;
      box-shadow: 0 0 12px rgba(163, 255, 18, 0.3) !important;
    }

    .feed-username-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      height: calc(64px + env(safe-area-inset-bottom, 0));
      background: rgba(7, 11, 20, 0.95);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-top: 1px solid var(--glass-border);
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding: 0 0.5rem;
      padding-bottom: env(safe-area-inset-bottom, 0);
      box-sizing: content-box;
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.35rem 0.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.6rem;
      font-weight: 500;
      font-family: var(--font-headline);
      transition: color 0.2s;
      min-width: 56px;
    }

    .mobile-nav-item .material-symbols-outlined {
      font-size: 1.5rem;
    }

    .mobile-nav-item.active {
      color: var(--toxic-lime);
    }

    .mobile-nav-item.active .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .app-nav .nav-tabs { display: none; }
      .mobile-bottom-nav { display: flex; }
    }
  </style>
</head>
<body class="shell-player">
  <div class="app-shell">
    <main class="app-main">
      <div class="feed-container" id="feedRoot"></div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from '../../services/auth.js';
    import { EsportsFeed } from '../../components/feed.js';
    import { initLayout } from '../../components/layout.js';
    initLayout();

    if (!requireRole('player')) throw new Error('unauthorized');

    const feed = new EsportsFeed(document.getElementById('feedRoot'), { mode: 'player' });
    feed.init();
  </script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script type="module" src="../../services/notification.js"></script>
</body>
</html>
