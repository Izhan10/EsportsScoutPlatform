<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tournaments · PakEsports Scout PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--deep-obsidian); color: var(--on-surface); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    :root { --sidebar-w: 240px; --nav-h: 60px; }

    .top-nav { display: flex; align-items: center; height: var(--nav-h); padding: 0 20px; background: rgba(7,11,20,0.9); backdrop-filter: blur(40px); border-bottom: 1px solid var(--glass-stroke); flex-shrink: 0; z-index: 100; gap: 0; }
    .top-nav .brand { font-family: var(--font-headline); font-weight: 800; font-size: 15px; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--toxic-lime), var(--electric-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; margin-right: 32px; }
    .top-nav .nav-links { display: flex; align-items: center; gap: 4px; }
    .top-nav .nav-links a { padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); border-radius: 8px; transition: background 0.2s, color 0.2s; white-space: nowrap; }
    .top-nav .nav-links a:hover { color: var(--on-surface); background: rgba(255,255,255,0.04); }
    .top-nav .nav-links a.active { color: var(--toxic-lime); background: rgba(163,255,18,0.08); }
    .top-nav .icon-group { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .top-nav .icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--on-surface-variant); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; }
    .top-nav .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--on-surface); }
    .top-nav .icon-btn .material-symbols-outlined { font-size: 20px; }
    .top-nav .notif-dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--competitive-red, #FF3B81); box-shadow: 0 0 8px rgba(255,59,129,0.6); }
    .top-nav .notif-btn { position: relative; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: rgba(7,11,20,0.95); border-right: 1px solid var(--glass-stroke); display: flex; flex-direction: column; padding: 20px 12px 16px; overflow-y: auto; z-index: 50; }
    .sidebar .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid var(--glass-stroke); margin-bottom: 16px; }
    .sidebar .sidebar-header .material-symbols-outlined { font-size: 22px; color: var(--toxic-lime); }
    .sidebar .sidebar-header .sidebar-title { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--toxic-lime); }
    .sidebar .sidebar-header .switch-link { font-family: var(--font-body); font-size: 11px; color: var(--on-surface-variant); margin-left: auto; transition: color 0.2s; }
    .sidebar .sidebar-header .switch-link:hover { color: var(--toxic-lime); }
    .sidebar .nav-section { margin-bottom: 20px; }
    .sidebar .nav-section .section-label { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-surface-variant); padding: 0 8px; margin-bottom: 6px; }
    .sidebar .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer; transition: background 0.2s, color 0.2s; position: relative; text-decoration: none; }
    .sidebar .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--on-surface); }
    .sidebar .nav-item .material-symbols-outlined { font-size: 18px; }
    .sidebar .nav-item.active { background: rgba(163,255,18,0.06); color: var(--toxic-lime); border-left: 2px solid var(--toxic-lime); border-radius: 0 8px 8px 0; margin-left: -2px; padding-left: 12px; }
    .sidebar .nav-item.active .material-symbols-outlined { color: var(--toxic-lime); }
    .sidebar .spacer { flex: 1; }
    .sidebar .bottom-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer; transition: background 0.2s, color 0.2s; text-decoration: none; }
    .sidebar .bottom-item:hover { background: rgba(255,255,255,0.04); color: var(--on-surface-variant); }
    .sidebar .bottom-item .material-symbols-outlined { font-size: 18px; }

    .main-area { flex: 1; overflow-y: auto; padding: 28px; padding-bottom: 100px; position: relative; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-family: var(--font-headline); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .page-header p { font-family: var(--font-body); font-size: 14px; color: var(--on-surface-variant); margin-top: 4px; }

    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: rgba(7,11,20,0.95); backdrop-filter: blur(40px); border-top: 1px solid var(--glass-stroke); z-index: 200; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom, 0); }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--on-surface-variant); font-size: 9px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; padding: 4px 0; text-decoration: none; }
    .bottom-nav a .material-symbols-outlined { font-size: 20px; }
    .bottom-nav a.active { color: var(--toxic-lime); }
    .bottom-nav a:hover { color: var(--on-surface-variant); }

    .filter-btn {
      padding: 7px 16px;
      border: 1px solid var(--glass-stroke);
      border-radius: 8px;
      background: transparent;
      color: var(--on-surface-variant);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.04); color: var(--on-surface); }
    .filter-btn.active { background: rgba(163,255,18,0.08); color: var(--toxic-lime); border-color: rgba(163,255,18,0.3); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--on-surface-variant); grid-column: 1 / -1; }

    .tournament-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px); z-index: 1000;
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .tournament-modal-overlay.open { display: flex; }
    .tournament-modal {
      background: #0D1B2A; border: 1px solid var(--glass-stroke);
      border-radius: 16px; padding: 2rem; max-width: 480px; width: 100%;
      position: relative; animation: fadeIn 0.2s ease;
    }
    .tournament-modal h2 {
      font-family: var(--font-headline); font-size: 1.3rem; font-weight: 800;
      margin: 0 0 0.5rem; padding-right: 2rem;
    }
    .tournament-modal .modal-close-btn {
      position: absolute; top: 1rem; right: 1rem;
      background: none; border: none; color: var(--on-surface-variant);
      font-size: 1.5rem; cursor: pointer; padding: 0.25rem; line-height: 1;
    }
    .tournament-modal .modal-close-btn:hover { color: var(--on-surface); }
    .tournament-modal .modal-body { display: flex; flex-direction: column; gap: 0.75rem; }
    .tournament-modal .modal-body .detail-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.9rem; color: var(--on-surface-variant);
    }
    .tournament-modal .modal-body .detail-row .material-symbols-outlined { font-size: 18px; }
    .tournament-modal .modal-body .detail-row strong { color: var(--on-surface); min-width: 60px; }
    .tournament-modal .modal-footer { margin-top: 1.25rem; display: flex; gap: 0.75rem; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-area { padding: 18px 16px; }
      .bottom-nav { display: flex; }
    }
    @media (max-width: 600px) {
      .top-nav .nav-links { display: none; }
    }
  </style>
</head>
<body class="shell-player">

    <main class="main-area">
      <div class="page-header">
        <h1>Browse tournaments</h1>
        <p>Pakistani esports events — register to compete</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;" id="gameFilters">
        <button class="filter-btn active" data-wiki="valorant">Valorant</button>
        <button class="filter-btn" data-wiki="counterstrike">CS2</button>
        <button class="filter-btn" data-wiki="pubgmobile">PUBG Mobile</button>
        <button class="filter-btn" data-wiki="fighters">Tekken 8</button>
      </div>
      <div class="grid-cards" id="tournamentGrid"></div>
    </main>

    <div class="tournament-modal-overlay" id="tournamentModal">
      <div class="tournament-modal">
        <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
        <h2 id="modalName"></h2>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <a id="modalLiquipediaLink" href="#" target="_blank" rel="noopener" class="btn btn-icon" style="text-decoration:none;">
            <span class="material-symbols-outlined" style="font-size:16px;">open_in_new</span> View on Liquipedia
          </a>
          <button class="btn btn-ghost" id="modalCloseBtn2" style="margin-left:auto;">Close</button>
        </div>
      </div>
    </div>

  <script type="module">
    import { requireRole } from '../../services/auth.js';
    import { api } from '../../services/api.js';
    import { initLayout } from '../../components/layout.js';
    initLayout();

    if (!requireRole('player')) throw new Error('unauthorized');

    let tournamentAbort = null;
    let tournamentDebounce = null;

    function showTournamentModal(t) {
      const modal = document.getElementById('tournamentModal');
      document.getElementById('modalName').textContent = t.name || '';
      const body = document.getElementById('modalBody');
      const rows = [];
      if (t.game) rows.push(`<div class="detail-row"><span class="material-symbols-outlined">sports_esports</span><strong>Game</strong> ${t.game}</div>`);
      if (t.tier) rows.push(`<div class="detail-row"><span class="material-symbols-outlined">grade</span><strong>Tier</strong> ${t.tier}</div>`);
      if (t.type) rows.push(`<div class="detail-row"><span class="material-symbols-outlined">wifi</span><strong>Type</strong> ${t.type}</div>`);
      if (t.prize) rows.push(`<div class="detail-row"><span class="material-symbols-outlined">emoji_events</span><strong>Prize</strong> ${t.prize}</div>`);
      if (t.date) {
        const dateStr = t.endDate && t.endDate !== t.date ? `${t.date} — ${t.endDate}` : t.date;
        rows.push(`<div class="detail-row"><span class="material-symbols-outlined">calendar_month</span><strong>Date</strong> ${dateStr}</div>`);
      }
      if (t.city || t.country) {
        const loc = [t.city, t.country].filter(Boolean).join(', ');
        rows.push(`<div class="detail-row"><span class="material-symbols-outlined">location_on</span><strong>Location</strong> ${loc}</div>`);
      }
      body.innerHTML = rows.join('');
      const link = document.getElementById('modalLiquipediaLink');
      if (t.url) { link.href = t.url; link.style.display = 'inline-flex'; }
      else link.style.display = 'none';
      modal.classList.add('open');
    }

    function hideTournamentModal() {
      document.getElementById('tournamentModal').classList.remove('open');
    }

    async function load(wiki) {
      if (tournamentAbort) tournamentAbort.abort();
      const controller = new AbortController();
      tournamentAbort = controller;

      const grid = document.getElementById('tournamentGrid');
      grid.innerHTML = '<div class="empty-state">Loading tournaments...</div>';
      try {
        const list = await api(`/tournaments/liquipedia?wiki=${wiki}&status=upcoming`, { signal: controller.signal });
        if (!list.length) {
          grid.innerHTML = '<div class="empty-state">No upcoming tournaments found.</div>';
          return;
        }
        grid._tournamentData = list;
        grid.innerHTML = list.map((t, i) => `
          <div class="glass-card" data-index="${i}">
            <h3>${t.name}</h3>
            <p><span class="badge">${t.game}</span></p>
            <p style="color:var(--neon);margin:0.5rem 0;">${t.prize || 'TBD'}</p>
            <p style="color:var(--muted);font-size:0.9rem;">${t.city ? t.city + ' · ' : ''}${t.date || 'TBD'}</p>
            <button class="btn btn-neon see-more-btn" style="margin-top:1rem;width:100%;">See More</button>
          </div>`).join('');
        grid.addEventListener('click', (e) => {
          const btn = e.target.closest('.see-more-btn');
          if (!btn) return;
          const card = btn.closest('.glass-card');
          const t = grid._tournamentData[card.dataset.index];
          if (t) showTournamentModal(t);
        });
      } catch (err) {
        if (err.name === 'AbortError') return;
        grid.innerHTML = `<div class="empty-state">Could not load tournaments: ${err.message}</div>`;
      }
    }

    document.getElementById('gameFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      clearTimeout(tournamentDebounce);
      tournamentDebounce = setTimeout(() => load(btn.dataset.wiki), 400);
    });

    load('valorant');

    document.getElementById('modalCloseBtn').onclick = hideTournamentModal;
    document.getElementById('modalCloseBtn2').onclick = hideTournamentModal;
    document.getElementById('tournamentModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideTournamentModal();
    });
  </script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script type="module" src="../../services/notification.js"></script>
</body>
</html>
